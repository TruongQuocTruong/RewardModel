  # One H200: 2 conditions x 12 rollouts -> 2 optimizer updates.
# Each optimizer update accumulates 12 rollout images.
name: omnigen2_qwen3_h200_2prompts

seed: 2233
device_specific_seed: true
workder_specific_seed: true

reward_server_config: reward_server.yml

data:
  data_path: data.yml
  use_chat_template: true
  maximum_text_tokens: 888
  prompt_dropout_prob: 0.0
  ref_img_dropout_prob: 0.0
  max_output_pixels: 262144
  max_input_pixels: [262144, 262144, 262144, 262144]
  max_side_length: 2048

model:
  pretrained_vae_model_name_or_path: black-forest-labs/FLUX.1-dev
  pretrained_text_encoder_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  pretrained_model_path: pretrained_models/OmniGen2/transformer/pytorch_model.bin

  arch_opt:
    patch_size: 2
    in_channels: 16
    hidden_size: 2520
    num_layers: 32
    num_refiner_layers: 2
    num_attention_heads: 21
    num_kv_heads: 7
    multiple_of: 256
    norm_eps: 1.0e-5
    axes_dim_rope: [40, 40, 40]
    axes_lens: [10000, 10000, 10000]
    text_feat_dim: 2048
    timestep_scale: 1000.0

transport:
  snr_type: lognorm
  do_shift: true
  dynamic_time_shift: true

train:
  global_batch_size: 24
  batch_size: 24
  gradient_accumulation_steps: 12

  max_train_steps: 200
  dataloader_num_workers: 4

  learning_rate: 1.0e-5
  scale_lr: false
  lr_scheduler: timm_constant_with_warmup
  warmup_t: 20
  warmup_lr_init: 1.0e-7
  warmup_prefix: true
  t_in_epochs: false

  use_8bit_adam: false
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_grad_norm: 1

  gradient_checkpointing: true
  set_grads_to_none: true
  allow_tf32: false
  mixed_precision: bf16

  ema_decay: 0.0

  lora_ft: true
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0

  checkpoint_format: lora

  rl:
    num_unique_prompts_per_sampling: 2
    num_images_per_prompt: 12
    batch_size_per_forward: 1

    # 24 / (1 x 12) = 2 optimizer updates per sampling round.
    num_update_steps_per_sampling: 2

    sigma_coef: 0.7
    negative_prompt: ''
    num_inference_step: 20
    max_sequence_length: 1024

    text_guidance_scale: 4
    image_guidance_scale: 2
    cfg_range_start: 0.0
    cfg_range_end: 0.6

    train_timesteps_fraction: 0.6
    reuse_samples_nums: 1

    clip_range: [0.0001, 0.0005]
    adv_clip_max: 5.0
    kl_loss_weight: 0.04

    apply_cfg_in_training: true
    server_type: vlm
    use_ori_neg_prompt_template: true
    time_shift_base_res: 168
    policy_loss_reweighting: true
    std_level: group

val:
  train_visualization_interval: 20
  num_train_visualization_samples: 1

logger:
  log_with: []
  checkpointing_steps: 20
  checkpoints_total_limit: 3

cache_dir: null
resume_from_checkpoint: null